# ML pipeline — must stay aligned with lib/core/ml_constants.dart
frame_count: 30
feature_dim: 178          # 126 hands + 52 face blendshapes
hand_feature_dim: 126
face_blendshape_dim: 52
num_classes: 15           # Full thesis vocabulary (Signer 1 complete)
num_hands: 2
landmarks_per_hand: 21
coords_per_landmark: 3

# Paths (relative to project root)
raw_video_dir: data/raw/videos
landmarks_dir: data/processed/landmarks
sequences_dir: data/processed/sequences
outputs_dir: ml/outputs
models_dir: ml/models
labels_json: assets/labels/sign_labels.json
flutter_model_path: assets/models/fsl_lstm.tflite
filename_map: data/filename_sign_map.csv

# MediaPipe Tasks model assets (downloaded by download_models.py)
hand_model: ml/models/hand_landmarker.task
face_model: ml/models/face_landmarker.task

# MediaPipe thresholds
min_hand_detection_confidence: 0.5
min_hand_presence_confidence: 0.5
min_tracking_confidence: 0.5
min_face_detection_confidence: 0.5
max_num_hands: 2

# Sequence building / active-sign segmentation
sequence_stride: 15
min_frames_per_video: 30
min_active_run_frames: 30
motion_energy_threshold: 0.015   # L2 hand-feature delta; filters lap-rest poses
motion_smooth_window: 5

# Augmentation (jitter hands + light blendshape noise)
augment_factor: 3
jitter_std: 0.01
rotation_deg_max: 15
blendshape_jitter_std: 0.02

# Training
test_split: 0.15
val_split: 0.15
random_seed: 42
epochs: 80
batch_size: 32
learning_rate: 0.001
early_stopping_patience: 12

# LSTM architecture
lstm_units_1: 64
lstm_units_2: 32
dropout: 0.3
